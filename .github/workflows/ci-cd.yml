name: Careos CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # 1. Validation & Test Phase
  test:
    name: 🧪 Lint & Test Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Validate Backend dependencies and syntax
      - name: Validate Backend
        run: |
          npm ci --prefix backend
          # Run backend tests once implemented (placeholder script validation)
          # npm test --prefix backend

      # Validate Frontend compilation
      - name: Validate & Build Frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

  # 2. Build & Registry Publish Phase (Triggered only on branch push)
  build-and-publish:
    name: 🐳 Docker Container Build & Push
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # ADDED PERMISSIONS BLOCK HERE
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry (GHCR) as standard secure registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Rolling Deploy Phase
  deploy:
    name: 🚀 Rolling Deployment (Mock Target)
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deployment Webhook or AWS ECS Update
        run: |
          echo "🚀 Deploying revision: ${{ github.sha }} to AWS ECS / Kubernetes"
          # Example deployment webhook call:
          # curl -X POST -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" https://deploy-agent.careos.com/webhook
